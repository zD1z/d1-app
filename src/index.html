<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>D1 App para sua ideia</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Transformo sua ideia em software sob medida, seja sistema, automação ou integração. Quinze anos construindo sistemas em que a falha é cara e aparece na hora.">
  <meta name="author" content="Danilo Pereira da Silva">
  <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="canonical" href="https://d1.app.br/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://d1.app.br/">
  <meta property="og:site_name" content="d1.app.br">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="D1 App para sua ideia">
  <meta property="og:description"
        content="Transformo sua ideia em software sob medida. Você traz o problema, eu trago a parte técnica.">

  <!-- A previa do link. URL absoluta porque quem le isto e um robo de fora, sem
       base href. O arquivo nao leva hash no nome: os robos guardam a imagem em
       cache pela URL, e trocar o nome a cada build faria a previa sumir das
       conversas antigas. Fonte da arte em public/og.svg. -->
  <meta property="og:image" content="https://d1.app.br/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="D1 App para sua ideia">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- As fontes vivem em public/fontes e sao declaradas em styles.css. O texto
       da primeira tela e Inter, entao ela vem no preload; a monoespacada
       aparece so em rotulo pequeno e pode esperar. -->
  <link rel="preload" as="font" type="font/woff2" href="fontes/inter-latin.woff2" crossorigin>
</head>
<body>
  <app-root>
    <!-- Substituído pelo Angular no bootstrap. -->
  </app-root>
</body>
</html>
