<header class="cabecalho">
  <div class="container cabecalho__barra">
    <a class="marca" routerLink="/" (click)="fecharMenu()">
      <img class="marca__icone" src="favicon.svg" width="36" height="36" alt="d1.app.br" />
    </a>

    <button
      #alternador
      type="button"
      class="cabecalho__alternar"
      [attr.aria-expanded]="menuAberto()"
      aria-controls="menu-principal"
      (click)="alternarMenu()"
    >
      <span class="apenas-leitor">{{ menuAberto() ? 'Fechar menu' : 'Abrir menu' }}</span>
      <span
        class="cabecalho__hamburguer"
        [class.cabecalho__hamburguer--aberto]="menuAberto()"
        aria-hidden="true"
      ></span>
    </button>

    <nav
      id="menu-principal"
      class="menu"
      [class.menu--aberto]="menuAberto()"
      aria-label="Navegação principal"
    >
      <ul class="menu__lista">
        @for (item of itens; track item.rotulo) {
          <li>
            <a
              class="menu__link"
              [routerLink]="item.rota"
              [fragment]="item.fragmento"
              [routerLinkActive]="classeDeAtivo(item)"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="fecharMenu()"
              >{{ item.rotulo }}</a
            >
          </li>
        }
        <li>
          <a class="menu__acao" routerLink="/" fragment="contato" (click)="fecharMenu()"
            >Falar comigo</a
          >
        </li>
      </ul>
    </nav>
  </div>
</header>
