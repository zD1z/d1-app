<footer class="rodape">
  <div class="container rodape__grade">
    <p class="rodape__marca">
      <span class="rodape__dominio">d1.app.br</span>
      <span class="rodape__nota">{{ perfil.titulo }} · {{ perfil.localizacao }}</span>
    </p>

    <ul class="rodape__links">
      @if (contato.email) {
        <li><a [href]="'mailto:' + contato.email">E-mail</a></li>
      }
      <li><a [href]="contato.github" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      @if (contato.linkedin) {
        <li><a [href]="contato.linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      }
    </ul>

    <p class="rodape__creditos">© {{ ano }} · feito em Angular, servido como HTML estático</p>
  </div>
</footer>
