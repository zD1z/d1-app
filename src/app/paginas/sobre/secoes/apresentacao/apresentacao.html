<section class="apresentacao" id="topo">
  <div class="container apresentacao__conteudo">
    <h1 class="apresentacao__nome">
      {{ perfil.nome }}
      <span class="apresentacao__cargo">{{ perfil.titulo }}</span>
    </h1>
    <p class="apresentacao__chamada">{{ perfil.chamada }}</p>

    <a
      class="botao botao--secundario apresentacao__linkedin"
      [href]="contato.linkedin"
      target="_blank"
      rel="noopener noreferrer"
    >LinkedIn</a>
  </div>
</section>
